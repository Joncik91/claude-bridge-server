<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="claude-bridge-server">
  <title>claude-bridge-server</title>
  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!-- A small bridge: two pillars + an arched span + deck across the top -->
  <g fill="none" stroke="#E8954A" stroke-linecap="round" stroke-linejoin="round">
    <!-- The arch: a half-ellipse curving between the two pillar bases -->
    <path d="M 96 280 Q 200 130 304 280" stroke-width="18"/>

    <!-- The deck: a horizontal beam across the top of the arch,
         representing the actual walkable surface of the bridge -->
    <line x1="76" y1="200" x2="324" y2="200" stroke-width="16"/>
  </g>

  <g fill="#E8954A">
    <!-- Left pillar/abutment: a tall narrow rectangle anchored at base -->
    <rect x="80" y="200" width="32" height="100" rx="2"/>
    <!-- Right pillar/abutment -->
    <rect x="288" y="200" width="32" height="100" rx="2"/>

    <!-- Two short vertical suspenders connecting deck to arch
         (like real arch-bridge tension cables, suggests structure) -->
    <rect x="156" y="200" width="6" height="46" rx="2"/>
    <rect x="238" y="200" width="6" height="46" rx="2"/>
  </g>
</svg>
