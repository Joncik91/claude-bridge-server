<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="claude-bridge-server">
  <title>claude-bridge-server</title>

  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!-- Connector is now a 3-dash data-flow rhythm, not a static wire.
       Reads as bidirectional traffic between architect and executor.
       Each dash 30 wide, 12 gap, weight 6 — heavier than v1's
       weight 4 so it survives at favicon size. -->
  <g stroke="#E8954A" stroke-width="6" stroke-linecap="square">
    <line x1="128" y1="205" x2="158" y2="205"/>
    <line x1="170" y1="205" x2="230" y2="205"/>
    <line x1="242" y1="205" x2="272" y2="205"/>
  </g>

  <circle cx="96" cy="205" r="26"
          fill="none" stroke="#E8954A" stroke-width="8"/>

  <circle cx="304" cy="205" r="26" fill="#E8954A"/>

  <!-- Diamond at midpoint — sits between the two middle dashes. -->
  <path d="M 200 187 L 217 205 L 200 223 L 183 205 Z"
        fill="#E8954A"/>
</svg>
